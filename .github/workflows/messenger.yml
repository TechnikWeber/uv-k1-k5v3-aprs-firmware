name: Messenger firmware

# Builds the Messenger edition with the same ARM toolchain as upstream's
# Dockerfile and runs the host tests. A push to the messenger branch publishes
# the image, the CHIRP driver and the web flasher page (web/index.html) on
# GitHub Pages; a tag messenger-v* makes a GitHub pre-release with the same
# files and the matching section of App/messenger/CHANGELOG.md as notes.

on:
  push:
    branches: [messenger]
    tags: ['messenger-v*']
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: messenger-${{ github.ref }}
  cancel-in-progress: true

env:
  ARM_GCC_VERSION: 13.3.rel1

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: ARM toolchain
        run: |
          set -e
          TARBALL="arm-gnu-toolchain-${ARM_GCC_VERSION}-x86_64-arm-none-eabi.tar.xz"
          curl -fsSL -o "$RUNNER_TEMP/tc.tar.xz" \
            "https://armkeil.blob.core.windows.net/developer/Files/downloads/gnu/${ARM_GCC_VERSION}/binrel/${TARBALL}"
          mkdir -p "$RUNNER_TEMP/tc"
          tar -xf "$RUNNER_TEMP/tc.tar.xz" -C "$RUNNER_TEMP/tc" --strip-components=1
          echo "$RUNNER_TEMP/tc/bin" >> "$GITHUB_PATH"
          sudo apt-get update -qq && sudo apt-get install -y -qq ninja-build

      - name: Host tests
        run: App/messenger/test/run.sh "$RUNNER_TEMP/tests"

      - name: Build
        run: |
          arm-none-eabi-gcc --version | head -1
          cmake --preset Messenger
          cmake --build --preset Messenger

      - name: Site
        run: |
          set -e
          mkdir -p site
          BIN=build/Messenger/f4hwn.messenger.bin
          cp "$BIN" site/
          cp chirp/f4hwn.messenger.chirp.py site/
          cp App/messenger/screens.png site/
          SHA=$(sha256sum "$BIN" | cut -d' ' -f1)
          echo "$SHA  f4hwn.messenger.bin" > site/f4hwn.messenger.bin.sha256
          sed -e "s/__COMMIT__/${GITHUB_SHA::8}/" \
              -e "s/__DATE__/$(date -u +%Y-%m-%d)/" \
              -e "s/__SHA256__/${SHA}/" web/index.html > site/index.html

      - name: Release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          TAG="$GITHUB_REF_NAME"
          # the section "## <tag>" of the changelog, up to the next "## "
          awk -v t="## $TAG" '$0 == t {on = 1; next} /^## / {on = 0} on' \
              App/messenger/CHANGELOG.md > "$RUNNER_TEMP/notes.md"
          test -s "$RUNNER_TEMP/notes.md" || { echo "no '## $TAG' in App/messenger/CHANGELOG.md"; exit 1; }
          VERSION="${TAG#messenger-}"
          gh release create "$TAG" --verify-tag --prerelease \
              --title "Messenger ${VERSION}" --notes-file "$RUNNER_TEMP/notes.md" \
              site/f4hwn.messenger.bin site/f4hwn.messenger.bin.sha256 \
              site/f4hwn.messenger.chirp.py

      - uses: actions/upload-artifact@v7
        with:
          name: f4hwn.messenger
          path: |
            build/Messenger/f4hwn.messenger.bin
            chirp/f4hwn.messenger.chirp.py

      - uses: actions/upload-pages-artifact@v5
        if: github.ref_type == 'branch'
        with:
          path: site

  deploy:
    needs: build
    if: github.ref_type == 'branch'
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
